<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>SQLCipher WASM Tests</title></head>
<body>
<pre id="log"></pre>
<div id="result" data-status="running" data-passed="0" data-failed="0" data-total="0"></div>
<script src="sqlcipher.js"></script>
<script src="sqlcipher-api.js"></script>
<script src="sqlcipher-oo1.js"></script>
<script>
(async function() {
  var logEl = document.getElementById("log");
  var resultEl = document.getElementById("result");
  var passed = 0, failed = 0, total = 0;

  function log(msg) {
    logEl.textContent += msg + "\n";
    console.log(msg);
  }

  async function test(name, fn) {
    total++;
    try {
      await fn();
      passed++;
      log("PASS: " + name);
    } catch(e) {
      failed++;
      log("FAIL: " + name + " -- " + e.message);
    }
    resultEl.dataset.passed = passed;
    resultEl.dataset.failed = failed;
    resultEl.dataset.total = total;
  }

  function assert(cond, msg) {
    if (!cond) throw new Error(msg || "assertion failed");
  }

  function assertEqual(a, b, msg) {
    if (a !== b) throw new Error((msg || "assertEqual") + ": " + JSON.stringify(a) + " !== " + JSON.stringify(b));
  }

  // ?backend=opfs or ?backend=indexeddb (set by run-tests.mjs) forces the worker's backend
  // through the test-only wrapper backend-worker.js; with no query the browser chooses.
  var BACKEND = new URLSearchParams(location.search).get("backend");
  var WORKER_QUERY = BACKEND ? "?backend=" + BACKEND : "";
  var _open = SQLCipher.open;
  SQLCipher.open = function(opts) {
    return _open(Object.assign({workerUrl: "backend-worker.js" + WORKER_QUERY}, opts));
  };

  // ── Tests ──────────────────────────────────────────────────

  await test("REQ1/API-1 mode reports the backend in use", async function() {
    var db = await SQLCipher.open({filename: "/t0.db", key: "k0"});
    resultEl.dataset.mode = db.mode;
    log("Backend: " + db.mode + (BACKEND ? " (expected " + BACKEND + ")" : " (browser's choice)"));
    if (BACKEND) assertEqual(db.mode, BACKEND, "mode");
    await db.close();
  });

  await test("REQ1/API-1 open and close", async function() {
    var db = await SQLCipher.open({filename: "/t1.db", key: "k1"});
    assert(db.mode === "opfs" || db.mode === "indexeddb", "bad mode: " + db.mode);
    assertEqual(db.filename, "/t1.db", "filename");
    await db.close();
  });

  await test("REQ1/API-1 exec and select with bind params", async function() {
    var db = await SQLCipher.open({filename: "/t2.db", key: "k2"});
    await db.exec("CREATE TABLE t (id INTEGER PRIMARY KEY, name TEXT, val REAL)");
    await db.exec("INSERT INTO t VALUES (?, ?, ?)", [1, "alice", 3.14]);
    await db.exec("INSERT INTO t VALUES (?, ?, ?)", [2, "bob", 2.72]);
    var rows = await db.select("SELECT * FROM t ORDER BY id");
    assertEqual(rows.length, 2, "row count");
    assertEqual(rows[0].name, "alice", "row 0 name");
    assertEqual(rows[1].val, 2.72, "row 1 val");
    var filtered = await db.select("SELECT name FROM t WHERE val > ?", [3.0]);
    assertEqual(filtered.length, 1, "filtered count");
    assertEqual(filtered[0].name, "alice", "filtered name");
    await db.close();
  });

  await test("REQ1/API-1 changes count", async function() {
    var db = await SQLCipher.open({filename: "/t3.db", key: "k3"});
    await db.exec("CREATE TABLE t (x INTEGER)");
    var r1 = await db.exec("INSERT INTO t VALUES (1)");
    assertEqual(r1.changes, 1, "single insert");
    await db.exec("INSERT INTO t VALUES (2)");
    await db.exec("INSERT INTO t VALUES (3)");
    var r2 = await db.exec("DELETE FROM t WHERE x >= 2");
    assertEqual(r2.changes, 2, "multi-row delete");
    await db.close();
  });

  await test("REQ1/API-1 flush", async function() {
    var db = await SQLCipher.open({filename: "/t4.db", key: "k4"});
    await db.exec("CREATE TABLE t (x TEXT)");
    await db.exec("INSERT INTO t VALUES ('flushed')");
    await db.flush();
    await db.close();
  });

  await test("REQ1/EXP-1 export returns Uint8Array", async function() {
    var db = await SQLCipher.open({filename: "/t5.db", key: "k5"});
    await db.exec("CREATE TABLE t (x TEXT)");
    await db.exec("INSERT INTO t VALUES ('exported')");
    var blob = await db.export();
    assert(blob instanceof Uint8Array, "should be Uint8Array");
    assert(blob.length >= 4096, "should be at least one page, got " + blob.length);
    await db.close();
  });

  await test("REQ1/EXP-1 import restores from blob", async function() {
    var db = await SQLCipher.open({filename: "/t6.db", key: "k6"});
    await db.exec("CREATE TABLE t (x TEXT)");
    await db.exec("INSERT INTO t VALUES ('original')");
    var blob = await db.export();
    await db.exec("DELETE FROM t");
    await db.exec("INSERT INTO t VALUES ('modified')");
    var before = await db.select("SELECT x FROM t");
    assertEqual(before[0].x, "modified", "before import");
    await db.import(blob);
    var after = await db.select("SELECT x FROM t");
    assertEqual(after.length, 1, "after import count");
    assertEqual(after[0].x, "original", "after import value");
    await db.close();
  });

  await test("REQ1/SHR-1 shred", async function() {
    var db = await SQLCipher.open({filename: "/t7.db", key: "k7"});
    await db.exec("CREATE TABLE t (x TEXT)");
    await db.exec("INSERT INTO t VALUES ('secret')");
    await db.flush();
    await db.shred();
    // Reopen: should be a fresh empty database (file was deleted)
    var db2 = await SQLCipher.open({filename: "/t7.db", key: "k7"});
    var rows = await db2.select("SELECT count(*) as n FROM sqlite_master");
    assertEqual(rows[0].n, 0, "shredded DB should be empty on reopen");
    await db2.close();
  });

  await test("REQ1/DUR-1 persistence across close and reopen", async function() {
    var db = await SQLCipher.open({filename: "/t8.db", key: "k8"});
    await db.exec("CREATE TABLE t (x TEXT)");
    await db.exec("INSERT INTO t VALUES ('persisted')");
    await db.flush();
    await db.close();
    var db2 = await SQLCipher.open({filename: "/t8.db", key: "k8"});
    var rows = await db2.select("SELECT x FROM t");
    assertEqual(rows.length, 1, "persisted count");
    assertEqual(rows[0].x, "persisted", "persisted value");
    await db2.close();
  });

  await test("REQ1/ENC-1 wrong key rejection", async function() {
    var db = await SQLCipher.open({filename: "/t9.db", key: "correctkey"});
    await db.exec("CREATE TABLE t (x TEXT)");
    await db.exec("INSERT INTO t VALUES ('secret')");
    await db.flush();
    await db.close();
    var db2 = await SQLCipher.open({filename: "/t9.db", key: "wrongkey"});
    var threw = false;
    try {
      await db2.select("SELECT * FROM t");
    } catch(e) {
      threw = true;
    }
    assert(threw, "wrong key should cause SELECT to fail");
    try { await db2.close(); } catch(e) {}
  });

  await test("REQ1/SHR-1 shredOnClose", async function() {
    var db = await SQLCipher.open({filename: "/t10.db", key: "k10"});
    await db.exec("CREATE TABLE t (x TEXT)");
    await db.exec("INSERT INTO t VALUES ('doomed')");
    await db.flush();
    await db.shredOnClose();
    await db.close();
    // Reopen: should be fresh empty database
    var db2 = await SQLCipher.open({filename: "/t10.db", key: "k10"});
    var rows = await db2.select("SELECT count(*) as n FROM sqlite_master");
    assertEqual(rows[0].n, 0, "shredOnClose DB should be empty on reopen");
    await db2.close();
  });

  // Written by official SQLCipher 4.0 (OpenSSL); same file and expectations
  // as upstream's compat-open-4.0-database, but through the WASM LibreSSL.
  await test("REQ1/FMT-1 upstream compat: opens SQLCipher 4.0 database", async function() {
    var resp = await fetch("sqlcipher-4.0-testkey.db");
    assert(resp.ok, "fixture fetch: HTTP " + resp.status);
    var bytes = new Uint8Array(await resp.arrayBuffer());
    var db = await SQLCipher.open({filename: "/compat40.db", key: "testkey"});
    await db.import(bytes);
    var check = await db.select("PRAGMA integrity_check");
    assertEqual(check[0].integrity_check, "ok", "integrity_check");
    var rows = await db.select("SELECT count(*) AS n FROM t1");
    assertEqual(rows[0].n, 78536, "row count");
    await db.close();
  });

  // Every byte value, and an empty array: an empty one must still be a BLOB, not NULL.
  var ALL_BYTES = new Uint8Array(256);
  for (var bi = 0; bi < 256; bi++) ALL_BYTES[bi] = bi;

  function assertBytes(got, want, msg) {
    assert(got instanceof Uint8Array, msg + ": not a Uint8Array: " + Object.prototype.toString.call(got));
    assertEqual(got.length, want.length, msg + " length");
    for (var i = 0; i < want.length; i++)
      if (got[i] !== want[i]) throw new Error(msg + ": byte " + i + " is " + got[i] + ", want " + want[i]);
  }

  await test("REQ2/API-2 BLOBs round-trip through the unified API", async function() {
    var db = await SQLCipher.open({filename: "/t11.db", key: "k11"});
    await db.exec("CREATE TABLE t (id INTEGER PRIMARY KEY, b BLOB)");
    await db.exec("INSERT INTO t VALUES (1, ?)", [ALL_BYTES]);
    await db.exec("INSERT INTO t VALUES (2, ?)", [new Uint8Array(0)]);
    var rows = await db.select("SELECT b, typeof(b) AS ty FROM t ORDER BY id");
    assertEqual(rows[0].ty, "blob", "row 1 type");
    assertBytes(rows[0].b, ALL_BYTES, "row 1");
    assertEqual(rows[1].ty, "blob", "row 2 type");
    assertBytes(rows[1].b, new Uint8Array(0), "row 2");
    await db.close();
  });

  await test("REQ3/OO1-1 BLOBs round-trip through the oo1 shim", async function() {
    var Module = await initSqlcipher();
    var db = new DB(Module, ":memory:");
    db.exec("CREATE TABLE t (id INTEGER PRIMARY KEY, b BLOB)");
    var ins = db.prepare("INSERT INTO t VALUES (?, ?)");
    ins.bind([1, ALL_BYTES]).stepReset();
    ins.bind(1, 2); ins.bindAsBlob(2, new Uint8Array(0)); ins.stepReset();
    ins.bind(1, 3); ins.bindAsBlob(2, "h\u00e9llo"); ins.stepReset();
    ins.finalize();

    var sel = db.prepare("SELECT b, typeof(b) AS ty FROM t ORDER BY id");
    assert(sel.step(), "row 1");
    assertEqual(sel.get(1), "blob", "row 1 type");
    assertBytes(sel.get(0), ALL_BYTES, "get(ndx)");
    assertBytes(sel.get([])[0], ALL_BYTES, "get([])");
    assertBytes(sel.get({}).b, ALL_BYTES, "get({})");
    assertBytes(sel.getBlob(0), ALL_BYTES, "getBlob");
    assert(sel.step(), "row 2");
    assertEqual(sel.get(1), "blob", "row 2 type");
    assertBytes(sel.getBlob(0), new Uint8Array(0), "empty bindAsBlob");
    assert(sel.step(), "row 3");
    assertEqual(sel.get(1), "blob", "row 3 type");
    assertBytes(sel.getBlob(0), new TextEncoder().encode("h\u00e9llo"), "bindAsBlob(string) as UTF-8");
    sel.finalize();
    db.close();
  });

  // ── oo1 shim: everything docs/oo1-api.md says ─────────────

  function assertThrows(fn, pattern, msg) {
    try { fn(); } catch (e) {
      assert(pattern.test(e.message), msg + ": threw \"" + e.message + "\", want " + pattern);
      return;
    }
    throw new Error(msg + ": did not throw");
  }

  await test("REQ4/OO1-2 every method docs/oo1-api.md lists exists", async function() {
    var resp = await fetch("oo1-api.md");
    assert(resp.ok, "oo1-api.md fetch: HTTP " + resp.status);
    var md = await resp.text();
    var Module = await initSqlcipher();
    var db = new DB(Module);
    var stmt = db.prepare("SELECT 1");
    var objs = {DB: db, Stmt: stmt}, seen = 0, missing = [];
    var re = /^### (DB|Stmt)\.prototype\.(\w+)/gm, m;
    while ((m = re.exec(md))) {
      seen++;
      if (typeof objs[m[1]][m[2]] !== "function") missing.push(m[1] + "." + m[2]);
    }
    stmt.finalize();
    db.close();
    assert(seen > 40, "found only " + seen + " documented methods");
    assertEqual(missing.join(", "), "", "documented but missing");
  });

  await test("REQ4/OO1-2 constructor: positional, flags, vfs, open errors", async function() {
    var Module = await initSqlcipher();
    var db = new DB(Module, "/flags.db", "c");
    db.exec("CREATE TABLE t (x)");
    assertEqual(db.dbFilename(), "/flags.db", "dbFilename");
    assert(typeof db.dbVfsName() === "string" && db.dbVfsName().length > 0, "dbVfsName: " + db.dbVfsName());
    db.close();

    var ro = new DB(Module, {filename: "/flags.db", flags: "r"});
    assertThrows(function() { ro.exec("INSERT INTO t VALUES (1)"); }, /readonly/, "write under flags r");
    ro.close();

    var w = new DB(Module, "/flags.db", "w", "unix-none");
    assertEqual(w.dbVfsName(), "unix-none", "vfs");
    w.exec("INSERT INTO t VALUES (1)");
    w.close();

    assertThrows(function() { new DB(Module, "/absent.db", "w"); }, /unable to open/, "flags w, no file");
    assertThrows(function() { new DB(Module, {filename: ":memory:", vfs: "no-such-vfs"}); }, /no such vfs/, "bad vfs");
    assertThrows(function() { new DB(Module, ":memory:", "cx"); }, /unknown flag/, "bad flag");
  });

  await test("REQ4/OO1-2 constructor: key, textkey, hexkey", async function() {
    var Module = await initSqlcipher();
    var raw = new Uint8Array(32);
    for (var i = 0; i < 32; i++) raw[i] = i * 7 + 1;
    var hex = "";
    for (var j = 0; j < 32; j++) hex += (raw[j] < 16 ? "0" : "") + raw[j].toString(16);

    var a = new DB(Module, {filename: "/raw.db", hexkey: hex});
    a.exec("CREATE TABLE t (x); INSERT INTO t VALUES ('raw')");
    a.close();
    var b = new DB(Module, {filename: "/raw.db", key: raw});
    assertEqual(b.selectValue("SELECT x FROM t"), "raw", "key bytes = hexkey");
    b.close();
    var c = new DB(Module, {filename: "/raw.db", key: hex});   // a string key is a passphrase
    assertThrows(function() { c.selectValue("SELECT x FROM t"); }, /file is not a database/, "hex as passphrase");
    c.close();

    var d = new DB(Module, {filename: "/text.db", textkey: "pw"});
    d.exec("CREATE TABLE t (x); INSERT INTO t VALUES ('text')");
    d.close();
    var e = new DB(Module, {filename: "/text.db", key: "pw"});
    assertEqual(e.selectValue("SELECT x FROM t"), "text", "textkey = key");
    e.close();

    assertThrows(function() { new DB(Module, {key: "a", hexkey: hex}); }, /only one of/, "two keys");
    assertThrows(function() { new DB(Module, {hexkey: "abc"}); }, /raw key is 32 bytes/, "short hexkey");
    assertThrows(function() { new DB(Module, {key: new Uint8Array(16)}); }, /raw key is 32 bytes/, "short key bytes");
  });

  await test("REQ4/OO1-2 exec: every statement, sql forms, options", async function() {
    var Module = await initSqlcipher();
    var db = new DB(Module);
    db.exec("CREATE TABLE t (id INTEGER PRIMARY KEY, name TEXT); INSERT INTO t VALUES (1, 'a');" +
            " -- a comment\n INSERT INTO t VALUES (2, 'b');");
    assertEqual(db.selectValue("SELECT count(*) FROM t"), 2, "multi-statement string");
    db.exec(["INSERT INTO t VALUES (3, ", "'c')"]);
    db.exec(new TextEncoder().encode("INSERT INTO t VALUES (4, 'd')"));
    assertEqual(db.selectValue("SELECT count(*) FROM t"), 4, "array and Uint8Array sql");

    db.exec("SELECT 1; INSERT INTO t VALUES (?, ?)", {bind: [5, "e"]});
    assertEqual(db.selectValue("SELECT name FROM t WHERE id = 5"), "e", "bind goes to the first statement with parameters");

    var names = [], seen = [];
    var rows = db.exec({
      sql: "SELECT id, name FROM t WHERE id < 3 ORDER BY id; SELECT name FROM t WHERE id = 4",
      rowMode: "$name", columnNames: names, returnValue: "resultRows",
      callback: function(row) { seen.push(row); }
    });
    assertEqual(JSON.stringify(rows), '["a","b","d"]', "rows of every statement, rowMode $name");
    assertEqual(JSON.stringify(seen), '["a","b","d"]', "callback");
    assertEqual(JSON.stringify(names), '["id","name"]', "columnNames from the first statement");

    var sql = db.exec({sql: "SELECT 1; SELECT 2", returnValue: "saveSql"});
    assertEqual(JSON.stringify(sql), '["SELECT 1;","SELECT 2"]', "saveSql");

    var stopped = [];
    db.exec({sql: "SELECT id FROM t ORDER BY id", rowMode: 0,
             callback: function(v) { stopped.push(v); return v < 2 ? undefined : false; }});
    assertEqual(JSON.stringify(stopped), "[1,2]", "callback returning false stops");

    assertThrows(function() { db.exec("INSERT INTO t VALUES (?, 'dup')", {bind: [1]}); },
                 /UNIQUE constraint failed/, "a failing step throws");
    assertThrows(function() { db.exec({sql: "SELECT 1", rowMode: "stmt", resultRows: []}); },
                 /rowMode 'stmt'/, "rowMode stmt with resultRows");
    assertThrows(function() { db.exec({sql: "SELECT 1 AS x", rowMode: "$y", callback: function() {}}); },
                 /no such column/, "rowMode $missing");
    assertEqual(db.exec("SELECT 1"), db, "returns this");
    db.close();
  });

  await test("REQ4/OO1-2 select shortcuts and get() with asType", async function() {
    var Module = await initSqlcipher();
    var db = new DB(Module);
    assertEqual(db.selectValue("SELECT 42", undefined, 3), "42", "selectValue asType TEXT");
    assertEqual(JSON.stringify(db.selectValues("SELECT 1.5 UNION ALL SELECT 2.5", null, 1)), "[1,2]",
                "selectValues asType INTEGER");
    assertEqual(db.selectValue("SELECT 1 WHERE 0"), undefined, "selectValue, no row");

    var st = db.prepare("SELECT 7, NULL, '{\"a\":[1,2]}', x'00ff'");
    assert(st.step(), "row");
    assertEqual(st.get(0, 2), 7, "get FLOAT");
    assertEqual(st.get(0, 3), "7", "get TEXT");
    assertBytes(st.get(3, 4), new Uint8Array([0, 255]), "get BLOB");
    assertEqual(st.getInt(1), null, "getInt NULL");
    assertEqual(st.getFloat(1), null, "getFloat NULL");
    assertEqual(st.getString(1), null, "getString NULL");
    assertEqual(st.getJSON(1), null, "getJSON NULL");
    assertEqual(st.getJSON(2).a[1], 2, "getJSON");
    assertThrows(function() { st.get(0, 9); }, /unknown type/, "bad asType");
    st.finalize();
    db.close();
  });

  await test("REQ4/OO1-2 Stmt: named parameters, metadata, lifecycle", async function() {
    var Module = await initSqlcipher();
    var db = new DB(Module);
    db.exec("CREATE TABLE t (a, b, c)");
    var ins = db.prepare("INSERT INTO t VALUES ($a, :b, @c)");
    assertEqual(ins.db, db, "stmt.db");
    assertEqual(ins.getParamIndex(":b"), 2, "getParamIndex");
    assertEqual(ins.getParamIndex(":nope"), 0, "getParamIndex, absent");
    assertEqual(ins.getParamName(3), "@c", "getParamName");
    assertEqual(ins.getParamName(9), null, "getParamName, absent");
    assertEqual(ins.isReadOnly(), false, "INSERT isReadOnly");
    ins.bind({$a: 1, ":b": "two", "@c": null}).stepReset();
    ins.bind("$a", 4).bind(":b", "five").bindAsBlob("@c", "six").stepReset();
    assertThrows(function() { ins.bind({$zz: 1}); }, /no such parameter/, "unknown name");
    assertEqual(db.openStatementCount(), 1, "openStatementCount");

    var sel = db.prepare("SELECT a, b, typeof(c) FROM t ORDER BY a");
    assertEqual(sel.isReadOnly(), true, "SELECT isReadOnly");
    assertEqual(db.openStatementCount(), 2, "openStatementCount, two");
    assert(sel.step() && sel.isBusy(), "busy after a row");
    assertEqual(JSON.stringify(sel.get([])), '[1,"two","null"]', "row 1");
    assert(sel.step(), "row 2");
    assertEqual(JSON.stringify(sel.get([])), '[4,"five","blob"]', "row 2");
    assert(!sel.step() && !sel.isBusy(), "done");
    assertEqual(sel.finalize(), 0, "finalize returns 0");
    assertEqual(sel.finalize(), undefined, "second finalize");
    assertEqual(sel.pointer, undefined, "pointer after finalize");

    var bad = db.prepare("INSERT INTO t VALUES (abs(-9223372036854775807 - 1), 0, 0)");
    assertThrows(function() { bad.stepFinalize(); }, /integer overflow/, "stepFinalize throws");
    assertEqual(bad.pointer, undefined, "stepFinalize finalized anyway");
    assertThrows(function() { db.prepare("  -- nothing "); }, /no SQL statement/, "empty prepare");

    db.close();
    assertEqual(ins.pointer, undefined, "close finalized the open statement");
    assertEqual(ins.finalize(), undefined, "finalize after close is a no-op");
  });

  await test("REQ4/OO1-2 DB: checkRc, dbName, onclose, trace", async function() {
    var Module = await initSqlcipher();
    var db = new DB(Module);
    assertEqual(db.checkRc(0), db, "checkRc(0)");
    assertThrows(function() { db.checkRc(1); }, /result code 1/, "checkRc(1)");
    db.exec("ATTACH ':memory:' AS aux");
    assertEqual(db.dbName(), "main", "dbName()");
    assertEqual(db.dbName(2), "aux", "dbName(2)");   // 0 main, 1 temp, 2 the first attached
    assertEqual(db.dbName(9), null, "dbName, absent");
    assertEqual(db.dbFilename(":memory:"), null, "dbFilename, no such database");

    var calls = [];
    db.onclose = {
      before: function() { calls.push("before"); throw new Error("ignored"); },
      after: [function(d) { calls.push(d === db ? "after" : "?"); }]
    };
    db.close();
    assertEqual(calls.join(","), "before,after", "onclose");
    assertEqual(db.isOpen(), false, "closed");

    var logged = [], realLog = console.log;
    console.log = function(m) { logged.push(String(m)); };
    try {
      var t = new DB(Module, ":memory:", "ct");
      t.exec("SELECT 1; SELECT 2");
      t.close();
    } finally {
      console.log = realLog;
    }
    assertEqual(JSON.stringify(logged), '["SQL TRACE: SELECT 1;","SQL TRACE: SELECT 2"]', "flag t");
  });

  await test("REQ4/OO1-2 createFunction: scalar, aggregate, window", async function() {
    var Module = await initSqlcipher();
    var db = new DB(Module);
    assertEqual(db.createFunction("double_it", function(pCtx, v) { return v * 2; }), db, "returns this");
    assertEqual(db.selectValue("SELECT double_it(21)"), 42, "scalar");
    assertThrows(function() { db.selectValue("SELECT double_it(1, 2)"); }, /wrong number of arguments/,
                 "arity from xFunc.length");

    db.createFunction({name: "echo", xFunc: function(pCtx, v) { return v; }, deterministic: true});
    assertEqual(JSON.stringify(db.selectArray(
      "SELECT typeof(echo(NULL)), echo('hé'), echo(2.5), echo(-7), typeof(echo(x'0102'))")),
      '["null","hé",2.5,-7,"blob"]', "argument and result types");
    assertBytes(db.selectValue("SELECT echo(?)", [ALL_BYTES]), ALL_BYTES, "blob through a function");

    db.createFunction("boom", function() { throw new Error("kaboom"); }, {arity: 0});
    assertThrows(function() { db.selectValue("SELECT boom()"); }, /kaboom/, "callback error");

    var sums = {};
    db.createFunction("sumsq", {
      xStep: function(pCtx, v) { sums[pCtx] = (sums[pCtx] || 0) + v * v; },
      xFinal: function(pCtx) { var r = sums[pCtx] || 0; delete sums[pCtx]; return r; }
    });
    db.exec("CREATE TABLE t (g, v); INSERT INTO t VALUES (1, 1), (1, 2), (2, 3)");
    assertEqual(JSON.stringify(db.selectArrays("SELECT g, sumsq(v) FROM t GROUP BY g ORDER BY g")),
                "[[1,5],[2,9]]", "aggregate");

    var win = {};
    db.createFunction({
      name: "wsum",
      xStep: function(pCtx, v) { win[pCtx] = (win[pCtx] || 0) + v; },
      xInverse: function(pCtx, v) { win[pCtx] -= v; },
      xValue: function(pCtx) { return win[pCtx] || 0; },
      xFinal: function(pCtx) { var r = win[pCtx] || 0; delete win[pCtx]; return r; }
    });
    assertEqual(JSON.stringify(db.selectValues(
      "SELECT wsum(v) OVER (ORDER BY v ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) FROM t")),
      "[1,3,5]", "window");

    assertThrows(function() { db.createFunction("bad", {xStep: function() {}}); }, /xStep and xFinal/, "no xFinal");
    db.close();
  });

  // ── 64-bit integers ────────────────────────────────────────
  // Safe integers come back as numbers; beyond 2^53 - 1, as BigInts. Compared as
  // strings, because JSON.stringify (in assertEqual's message) throws on a BigInt.

  var INT_CASES = [
    {v: Math.pow(2, 40), s: "1099511627776"},
    {v: -Math.pow(2, 40), s: "-1099511627776"},
    {v: Number.MAX_SAFE_INTEGER, s: "9007199254740991"},
    {v: BigInt("9007199254740993"), s: "9007199254740993"},
    {v: BigInt("9223372036854775807"), s: "9223372036854775807"},
    {v: BigInt("-9223372036854775808"), s: "-9223372036854775808"}
  ];

  function assertInt(got, want, msg) {
    var big = !Number.isSafeInteger(Number(want));
    assertEqual(typeof got, big ? "bigint" : "number", msg + " type of " + want);
    assertEqual(String(got), want, msg);
  }

  await test("REQ5/INT-1 64-bit integers through the unified API", async function() {
    var db = await SQLCipher.open({filename: "/t12.db", key: "k12"});
    await db.exec("CREATE TABLE t (id INTEGER PRIMARY KEY, v)");
    for (var i = 0; i < INT_CASES.length; i++)
      await db.exec("INSERT INTO t VALUES (?, ?)", [i, INT_CASES[i].v]);
    var rows = await db.select("SELECT v, typeof(v) AS ty, CAST(v AS TEXT) AS s FROM t ORDER BY id");
    for (var j = 0; j < INT_CASES.length; j++) {
      assertEqual(rows[j].ty, "integer", "stored as INTEGER: " + INT_CASES[j].s);
      assertEqual(rows[j].s, INT_CASES[j].s, "stored exactly");
      assertInt(rows[j].v, INT_CASES[j].s, "read back");
    }
    var threw = false;
    try { await db.exec("INSERT INTO t VALUES (99, ?)", [BigInt("9223372036854775808")]); }
    catch (e) { threw = /64 bits/.test(e.message); }
    assert(threw, "a BigInt beyond 64 bits rejects");
    await db.close();
  });

  await test("REQ5/INT-1 64-bit integers through the oo1 shim", async function() {
    var Module = await initSqlcipher();
    var db = new DB(Module);
    db.exec("CREATE TABLE t (id INTEGER PRIMARY KEY, v)");
    var ins = db.prepare("INSERT INTO t VALUES (?, ?)");
    for (var i = 0; i < INT_CASES.length; i++) ins.bind([i, INT_CASES[i].v]).stepReset();
    assertThrows(function() { ins.bind(2, BigInt("-9223372036854775809")); }, /64 bits/, "beyond 64 bits");
    ins.finalize();

    var sel = db.prepare("SELECT v, typeof(v), CAST(v AS TEXT) FROM t ORDER BY id");
    for (var j = 0; sel.step(); j++) {
      var want = INT_CASES[j].s;
      assertEqual(sel.get(1), "integer", "stored as INTEGER: " + want);
      assertEqual(sel.get(2), want, "stored exactly");
      assertInt(sel.get(0), want, "get(ndx)");
      assertInt(sel.get([])[0], want, "get([])");
      assertInt(sel.getInt(0), want, "getInt");
      assertInt(sel.get(0, 1), want, "get(ndx, INTEGER)");
    }
    assertEqual(j, INT_CASES.length, "rows");
    sel.finalize();
    assertInt(db.selectValue("SELECT 9223372036854775807"), "9223372036854775807", "selectValue");
    assertInt(db.selectValue("SELECT '-9223372036854775808'", undefined, 1), "-9223372036854775808",
              "TEXT as INTEGER");

    db.createFunction("echo", function(pCtx, v) { return v; });
    db.createFunction("plus1", function(pCtx, v) { return v + BigInt(1); });
    for (var k = 0; k < INT_CASES.length; k++) {
      var s = INT_CASES[k].s;
      assertEqual(db.selectValue("SELECT typeof(echo(" + s + "))"), "integer", "function result type " + s);
      assertInt(db.selectValue("SELECT echo(" + s + ")"), s, "function argument and result");
    }
    assertInt(db.selectValue("SELECT plus1(CAST(? AS INTEGER))", [BigInt("9007199254740992")]),
              "9007199254740993", "BigInt arithmetic in a function");
    db.close();
  });

  // ── Errors ─────────────────────────────────────────────────

  async function assertRejects(promise, pattern, msg) {
    try { await promise; } catch (e) {
      assert(pattern.test(e.message), msg + ": rejected with \"" + e.message + "\", want " + pattern);
      return;
    }
    throw new Error(msg + ": did not reject");
  }

  await test("REQ1/ERR-1 exec with bind values rejects on a failed step", async function() {
    var db = await SQLCipher.open({filename: "/t13.db", key: "k13"});
    await db.exec("CREATE TABLE t (id INTEGER PRIMARY KEY, name TEXT)");
    await db.exec("INSERT INTO t VALUES (?, ?)", [1, "a"]);
    await assertRejects(db.exec("INSERT INTO t VALUES (?, ?)", [1, "dup"]),
                        /UNIQUE constraint failed: t\.id/, "duplicate key");
    var rows = await db.select("SELECT name FROM t");
    assertEqual(rows.length, 1, "rows after the failed insert");
    assertEqual(rows[0].name, "a", "the original row");
    await db.exec("INSERT INTO t VALUES (?, ?)", [2, "b"]);   // the worker is still usable
    await db.close();
  });

  await test("REQ1/ERR-1 select rejects on a failed step", async function() {
    var db = await SQLCipher.open({filename: "/t14.db", key: "k14"});
    await assertRejects(db.select("SELECT abs(-9223372036854775807 - 1) AS x"),
                        /integer overflow/, "without bind values");
    await assertRejects(db.select("SELECT abs(?) AS x", [BigInt("-9223372036854775808")]),
                        /integer overflow/, "with bind values");
    var rows = await db.select("SELECT 1 AS x");
    assertEqual(rows[0].x, 1, "still usable");
    await db.close();
  });

  await test("REQ2/ENC-2 no key means an unencrypted database", async function() {
    var db = await SQLCipher.open({filename: "/t15.db"});
    await db.exec("CREATE TABLE t (x TEXT)");
    await db.exec("INSERT INTO t VALUES (?)", ["plain"]);
    var bytes = await db.export();
    var header = new TextDecoder().decode(bytes.subarray(0, 16));
    assertEqual(header, "SQLite format 3\u0000", "file header");
    await db.close();
  });

  // The probe worker (shred-probe-worker.js) posts a file's bytes just before the
  // worker deletes it, so the test can see what shred() left in storage.
  await test("REQ1/SHR-1 shred overwrites the stored file before deleting it", async function() {
    var probe = new BroadcastChannel("shred-probe");
    var reported = new Promise(function(resolve, reject) {
      probe.onmessage = function(e) { if (/t16\.db$/.test(e.data.name)) resolve(e.data); };
      setTimeout(function() { reject(new Error("no probe report within 10 s")); }, 10000);
    });
    try {
      var db = await SQLCipher.open({filename: "/t16.db", key: "k16", workerUrl: "shred-probe-worker.js" + WORKER_QUERY});
      await db.exec("CREATE TABLE t (x BLOB)");
      await db.exec("INSERT INTO t VALUES (?)", [ALL_BYTES]);
      await db.exec("INSERT INTO t VALUES (zeroblob(20000))");
      var stored = await db.export();
      await db.shred();
      var r = await reported;
      assert(!r.error, "probe could not read the file: " + r.error);
      if (BACKEND) assertEqual(r.backend, BACKEND, "backend the probe saw");
      assertEqual(r.bytes.length, stored.length, r.backend + ": length of what was deleted");
      var same = 0;
      for (var i = 0; i < stored.length; i++) if (r.bytes[i] === stored[i]) same++;
      // Random bytes match the old ones at about 1 in 256 positions; the file left as it was matches at all.
      assert(same < stored.length / 20, r.backend + ": " + same + " of " + stored.length +
             " bytes unchanged before delete");
    } finally {
      probe.close();
    }
  });

  // ── Report ─────────────────────────────────────────────────

  resultEl.dataset.status = failed === 0 ? "pass" : "fail";
  log("\n" + passed + "/" + total + " passed" +
      (failed > 0 ? ", " + failed + " FAILED" : ""));
})();
</script>
</body>
