name: build-test

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # The upstream SQLCipher release this fork is based on. Bump it on each
  # upstream merge (CONTRIBUTING "Syncing with upstream").
  UPSTREAM_TAG: v4.16.0
  # LibreSSL's version and tarball hash are in libressl.env, read by
  # check.sh and by the wasm job.

jobs:
  upstream-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The checkout is shallow and has no upstream tags, so fetch just the tag.
      # git diff compares the two trees; no shared history is needed.
      - name: REQ1/UP-2 src/ differs from upstream only in the two patched files
        run: |
          git fetch --no-tags --depth=1 https://github.com/sqlcipher/sqlcipher.git \
            "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          # Two steps, so a failing git diff stops the step instead of
          # vanishing into the pipe and reading as "no other files".
          changed=$(git diff --name-only "$UPSTREAM_TAG" HEAD -- src/)
          others=$(echo "$changed" | grep -vxE 'src/(crypto_openssl|sqlcipher)\.c' || true)
          if [ -n "$others" ]; then
            echo "FAIL: REQ1/UP-2 src/ files changed from $UPSTREAM_TAG besides the two patched ones:"
            echo "$others"
            exit 1
          fi
          echo "PASS: REQ1/UP-2 src/ differs from $UPSTREAM_TAG only in crypto_openssl.c and sqlcipher.c"

  native:
    strategy:
      # One platform's failure must not cancel the others: each result is evidence.
      fail-fast: false
      matrix:
        include:
          # Debian (glibc) — works on Debian, Ubuntu, RHEL, etc.
          - os: ubuntu-24.04
            container: debian:bookworm
            artifact: libsqlcipher-linux-glibc-x64.a
            deps: apt-get update && apt-get install -y gcc make cmake tcl tcl-dev curl ca-certificates
          - os: ubuntu-24.04-arm
            container: debian:bookworm
            artifact: libsqlcipher-linux-glibc-arm64.a
            deps: apt-get update && apt-get install -y gcc make cmake tcl tcl-dev curl ca-certificates
          # Alpine (musl) — works on Alpine, Docker scratch, etc.
          - os: ubuntu-24.04
            container: alpine:3.24
            artifact: libsqlcipher-linux-musl-x64.a
            deps: apk add gcc make cmake musl-dev tcl tcl-dev curl
          # macOS
          - os: macos-26
            container: ""
            artifact: libsqlcipher-macos-arm64.a
            deps: ""

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        if: matrix.deps != ''
        run: ${{ matrix.deps }}

      # LibreSSL (pinned in libressl.env), the release library, the smoke
      # test, walseal's checks and upstream's TCL suite, as a contributor runs
      # them locally.
      # The suite runs on linux-glibc-x64 only: REQ1/UP-1 promises it there,
      # and it has never been run on the other platforms.
      - name: REQ1/ENC-1 REQ2/ENC-2 REQ2/PLAT-1 REQ1/DUR-2 REQ6/ENC-3 REQ1/UP-1 REQ1/FMT-1 check.sh
        run: ./check.sh
        env:
          CHECK_TCL: ${{ matrix.artifact == 'libsqlcipher-linux-glibc-x64.a' && 'yes' || 'no' }}
          # One crash-replay seed keeps CI to minutes; all three run before a release.
          SEEDS: '7'

      # check.sh keeps the release build as libsqlcipher.a; the TCL suite's
      # test-only build never replaces it.
      - name: Rename artifact
        run: cp libsqlcipher.a ${{ matrix.artifact }}

      # The name is the claim (FINDINGS 2026-10-20: a "macos-x64" .a was arm64).
      # file on a .a says only "ar archive", so read the members: objdump -f
      # on Linux (binutils comes with gcc), lipo -info on macOS. POSIX sh:
      # the Alpine container has no bash.
      - name: REQ2/PLAT-1 the artifact is the architecture its name says
        run: |
          a=${{ matrix.artifact }}
          case "$a" in
            *-x64.a)   want_elf='i386:x86-64'; want_macho='x86_64' ;;
            *-arm64.a) want_elf='aarch64';     want_macho='arm64' ;;
            *) echo "FAIL: REQ2/PLAT-1 no known architecture in the name $a"; exit 1 ;;
          esac
          if [ "$(uname -s)" = Darwin ]; then
            # Only a thin archive prints "Non-fat file: ... is architecture: X";
            # a fat one lists several and leaves this empty.
            lipo -info "$a"
            got=$(lipo -info "$a" | sed -n 's/^Non-fat file: .* is architecture: //p')
            want="$want_macho"
          else
            # Every member's architecture, deduplicated: exactly one line if
            # they all agree. A failing objdump leaves it empty.
            got=$(objdump -f "$a" | sed -n 's/^architecture: \([^,]*\),.*/\1/p' | sort -u)
            echo "$got"
            want="$want_elf"
          fi
          if [ "$got" != "$want" ]; then
            echo "FAIL: REQ2/PLAT-1 $a is not $want"
            exit 1
          fi
          echo "PASS: REQ2/PLAT-1 $a is $want"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl cmake

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984   # v16
        with:
          version: 3.1.74

      - name: Download and build LibreSSL (native + WASM)
        run: |
          . ./libressl.env
          # Download to a file and check it before unpacking: through a pipe,
          # a changed or truncated tarball would be built without complaint.
          t=libressl-$LIBRESSL_VERSION.tar.gz
          curl -fsSL -o "$t" https://github.com/libressl/portable/releases/download/v$LIBRESSL_VERSION/$t
          echo "$LIBRESSL_SHA256  $t" | sha256sum -c -
          tar xzf "$t"
          cd libressl-$LIBRESSL_VERSION
          mkdir build && cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=$HOME/libressl \
            -DLIBRESSL_APPS=OFF -DLIBRESSL_TESTS=OFF -DBUILD_SHARED_LIBS=OFF
          make -j$(nproc)
          make install
          cd ..
          mkdir -p build-wasm && cd build-wasm
          emcmake cmake .. -DCMAKE_INSTALL_PREFIX=$HOME/libressl-wasm \
            -DLIBRESSL_APPS=OFF -DLIBRESSL_TESTS=OFF -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_FLAGS="-DHAVE_TIMEGM -DHAVE_GETENTROPY -D__STDC_NO_ATOMICS__"
          emmake make -j$(nproc) crypto
          mkdir -p $HOME/libressl-wasm/lib
          cp crypto/libcrypto.a $HOME/libressl-wasm/lib/

      - name: Build WASM
        run: |
          LIBRESSL_NATIVE=$HOME/libressl \
          LIBRESSL_WASM=$HOME/libressl-wasm \
          ./build-sqlcipher-libressl.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Prepare WASM test directory
        run: |
          cp wasm/dist/sqlcipher.js tests/wasm/
          cp wasm/dist/sqlcipher.wasm tests/wasm/
          cp wasm/dist/sqlcipher-api.js tests/wasm/
          cp wasm/dist/sqlcipher-worker.js tests/wasm/
          cp wasm/dist/sqlcipher-oo1.js tests/wasm/
          cp sqlcipher-resources/sqlcipher-4.0-testkey.db tests/wasm/
          cp docs/oo1-api.md tests/wasm/

      - name: Install Playwright
        run: |
          cd tests/wasm
          npm ci
          npx playwright install --with-deps chromium firefox webkit

      - name: REQ1/WASM-1 REQ1/DUR-1 REQ1/DUR-2 REQ1/API-1 run WASM tests in Chromium, Firefox and WebKit on the OPFS and IndexedDB backends
        run: node tests/wasm/run-tests.mjs
        env:
          NATIVE_EXPORT_DIR: ${{ runner.temp }}/exported

      # Each browser run above saved what export() returned. This repository's native
      # build (the amalgamation "Build WASM" made, and native LibreSSL) must open every one
      # under its key; open-export.c says what it checks. Six files: three browsers, two
      # backends (run-tests.mjs). Key and row count as in test.html.
      - name: REQ1/EXP-1 REQ1/FMT-1 exported files open in the native build
        run: |
          gcc -O2 -DSQLITE_HAS_CODEC -DSQLCIPHER_CRYPTO_OPENSSL -DSQLITE_TEMP_STORE=2 \
            -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown \
            -I. -I$HOME/libressl/include -o "$RUNNER_TEMP/open-export" tests/wasm/open-export.c sqlite3.c \
            $HOME/libressl/lib/libcrypto.a -lpthread -lm
          n=0
          for f in "$RUNNER_TEMP"/exported/*.db; do
            "$RUNNER_TEMP/open-export" "$f" export-key 50
            n=$((n + 1))
          done
          if [ "$n" -ne 6 ]; then echo "FAIL: REQ1/EXP-1 $n exported files, want 6"; exit 1; fi

      - name: Package static libs for custom WASM builds
        run: |
          mkdir -p static-pkg
          cp sqlite3.c sqlite3.h static-pkg/
          cp wasm/sqlcipher_wasm.c wasm/opfs_vfs.c wasm/walseal.c wasm/walseal.h wasm/walseal_sqlcipher.c static-pkg/
          cp $HOME/libressl-wasm/lib/libcrypto.a static-pkg/libcrypto-wasm.a
          cp -r $HOME/libressl/include/openssl static-pkg/openssl
          tar czf wasm/dist/sqlcipher-wasm-static.tar.gz -C static-pkg .
          ls -lh wasm/dist/sqlcipher-wasm-static.tar.gz

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sqlcipher-wasm
          path: |
            wasm/dist/sqlcipher.js
            wasm/dist/sqlcipher.wasm
            wasm/dist/sqlcipher-wasm-static.tar.gz
            wasm/dist/sqlcipher-api.js
            wasm/dist/sqlcipher-oo1.js
            wasm/dist/sqlcipher-worker.js
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [upstream-diff, native, wasm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p dist
          find artifacts -type f | while read f; do cp "$f" dist/; done
          ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64   # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.js
            dist/*.wasm
            dist/*.tar.gz
            dist/*.a
